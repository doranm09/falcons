services:
  db:
    image: postgres:17.2
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [appnet]
    restart: unless-stopped

  web:
    build: .
    command: /code/docker/entrypoint-web.sh
    # When using the bind mount (.:/code), match the container UID/GID to the host
    # so Django collectstatic can write into /code/staticfiles.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: .env
    environment:
      POSTGRES_NAME: ${POSTGRES_NAME:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      SIEM_INGEST_TOKEN: ${SIEM_INGEST_TOKEN:-iaea-demo-siem-token}
      SIEM_SENSOR_TOKEN: ${SIEM_SENSOR_TOKEN:-iaea-demo-siem-token}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-iaea-demo-agent-token}
      AGENT_API_TOKEN_REQUIRED: ${AGENT_API_TOKEN_REQUIRED:-1}
      DJANGO_SETTINGS_MODULE: cyber_pen_test.settings
      PYTHONPATH: /code
      GVM_HOST: ${GVM_HOST:-openvas}
      GVM_PORT: ${GVM_PORT:-9390}
      GVM_USER: ${GVM_USER:-admin}
      GVM_PASS: ${GVM_PASS:-admin}
      GVM_SOCKET_PATH: ${GVM_SOCKET_PATH:-/opt/gvm-run/gvmd.sock}
      GVMD_POSTGRES_HOST: ${GVMD_POSTGRES_HOST:-/var/run/postgresql}
      GVMD_POSTGRES_PORT: ${GVMD_POSTGRES_PORT:-}
      GVMD_POSTGRES_NAME: ${GVMD_POSTGRES_NAME:-gvmd}
      GVMD_POSTGRES_USER: ${GVMD_POSTGRES_USER:-gvmd}
      GVMD_POSTGRES_PASSWORD: ${GVMD_POSTGRES_PASSWORD:-}
      RISK_ASSESSMENT_API_URL: ${RISK_ASSESSMENT_API_URL:-http://risk-assessment:7890}
      ICS_RISK_ASSESSMENT_REPO_PATH: ${ICS_RISK_ASSESSMENT_REPO_PATH:-/opt/ics-risk-assessment}
      TRIVY_CACHE_DIR: /tmp/cyber-sbom-cache/trivy
      GRYPE_DB_CACHE_DIR: /tmp/cyber-sbom-cache/grype/db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      risk-assessment:
        condition: service_started
    networks: [appnet, greenbone_net]
    ports: ["8000:8000"]
    volumes:
      - .:/code
      - ../ics-risk-assessment:/opt/ics-risk-assessment
      - /opt/gvm-run:/opt/gvm-run
      - psql_socket_vol:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    networks: [appnet]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  celery:
    build: .
    command: celery -A cyber_pen_test worker --loglevel=info
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: .env
    environment:
      POSTGRES_NAME: ${POSTGRES_NAME:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      SIEM_INGEST_TOKEN: ${SIEM_INGEST_TOKEN:-iaea-demo-siem-token}
      SIEM_SENSOR_TOKEN: ${SIEM_SENSOR_TOKEN:-iaea-demo-siem-token}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-iaea-demo-agent-token}
      AGENT_API_TOKEN_REQUIRED: ${AGENT_API_TOKEN_REQUIRED:-1}
      DJANGO_SETTINGS_MODULE: cyber_pen_test.settings
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      PYTHONPATH: /code
      GVM_HOST: ${GVM_HOST:-openvas}
      GVM_PORT: ${GVM_PORT:-9390}
      GVM_USER: ${GVM_USER:-admin}
      GVM_PASS: ${GVM_PASS:-admin}
      GVM_SOCKET_PATH: ${GVM_SOCKET_PATH:-/opt/gvm-run/gvmd.sock}
      GVMD_POSTGRES_HOST: ${GVMD_POSTGRES_HOST:-/var/run/postgresql}
      GVMD_POSTGRES_PORT: ${GVMD_POSTGRES_PORT:-}
      GVMD_POSTGRES_NAME: ${GVMD_POSTGRES_NAME:-gvmd}
      GVMD_POSTGRES_USER: ${GVMD_POSTGRES_USER:-gvmd}
      GVMD_POSTGRES_PASSWORD: ${GVMD_POSTGRES_PASSWORD:-}
      RISK_ASSESSMENT_API_URL: ${RISK_ASSESSMENT_API_URL:-http://risk-assessment:7890}
      ICS_RISK_ASSESSMENT_REPO_PATH: ${ICS_RISK_ASSESSMENT_REPO_PATH:-/opt/ics-risk-assessment}
      TRIVY_CACHE_DIR: /tmp/cyber-sbom-cache/trivy
      GRYPE_DB_CACHE_DIR: /tmp/cyber-sbom-cache/grype/db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      risk-assessment:
        condition: service_started
    networks: [appnet, greenbone_net]
    volumes:
      - .:/code
      - ../ics-risk-assessment:/opt/ics-risk-assessment
      - /opt/gvm-run:/opt/gvm-run
      - psql_socket_vol:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "celery -A cyber_pen_test inspect ping -t 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  sniffer:
    build:
      context: .
      dockerfile: sniffer/Dockerfile.sniffer
    command: python /sniffer/listener_api.py
    cap_add: [NET_ADMIN, NET_RAW]
    ports:  ["5050:5050"]
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5050/interfaces || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  risk-assessment:
    build:
      context: ../ics-risk-assessment
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 7890
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/.cache
    networks: [appnet]
    ports: ["7890:7890"]
    volumes:
      - ../ics-risk-assessment:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7890/status')\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-ChangeMe!2026}
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports: ["9200:9200"]
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["5601:5601"]
    networks: [appnet]
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  opensearch-init:
    image: curlimages/curl:8.5.0
    depends_on:
      opensearch:
        condition: service_healthy
    networks: [appnet]
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_INDEX_PREFIX: ${OPENSEARCH_INDEX_PREFIX:-siem-events}
      OPENSEARCH_USER: ${OPENSEARCH_USER:-}
      OPENSEARCH_PASS: ${OPENSEARCH_PASS:-}
    volumes:
      - ./configs/opensearch:/configs:ro
    command: >-
      sh -c "
      PREFIX=\"$${OPENSEARCH_INDEX_PREFIX:-siem-events}\";
      POLICY_ID=\"$${PREFIX}-policy\";
      TEMPLATE_NAME=\"$${PREFIX}-template\";
      AUTH=\"\"; if [ -n \"$${OPENSEARCH_USER}\" ]; then AUTH=\"-u $${OPENSEARCH_USER}:$${OPENSEARCH_PASS}\"; fi;
      sed \"s/__OPENSEARCH_INDEX_PREFIX__/$${PREFIX}/g; s/__SIEM_POLICY_ID__/$${POLICY_ID}/g\" /configs/siem_ism_policy.json > /tmp/siem_ism_policy.json;
      sed \"s/__OPENSEARCH_INDEX_PREFIX__/$${PREFIX}/g; s/__SIEM_POLICY_ID__/$${POLICY_ID}/g\" /configs/siem_index_template.json > /tmp/siem_index_template.json;
      curl -fsS $$AUTH -H 'Content-Type: application/json' -X PUT \"$${OPENSEARCH_URL}/_plugins/_ism/policies/$${POLICY_ID}\" -d @/tmp/siem_ism_policy.json;
      curl -fsS $$AUTH -H 'Content-Type: application/json' -X PUT \"$${OPENSEARCH_URL}/_index_template/$${TEMPLATE_NAME}\" -d @/tmp/siem_index_template.json;
      "

networks:
  appnet:
  greenbone_net:
    external: true
    name: cyber_pen_test_greenbone_shared

volumes:
  redis_data:
  opensearch_data:
  psql_socket_vol:
    external: true
    name: cyber_pen_test_gvmd_psql_socket
