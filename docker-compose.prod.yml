services:
  db:
    image: postgres:17.2
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [appnet]
    restart: unless-stopped

  web:
    build: .
    command: /code/docker/entrypoint-web.sh
    env_file: .env
    environment:
      POSTGRES_NAME: ${POSTGRES_NAME:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: cyber_pen_test.settings
      PYTHONPATH: /code
      GVM_HOST: ${GVM_HOST:-openvas}
      GVM_PORT: ${GVM_PORT:-9390}
      GVM_USER: ${GVM_USER:-admin}
      GVM_PASS: ${GVM_PASS:-admin}
      GVM_SOCKET_PATH: ${GVM_SOCKET_PATH:-/opt/gvm-run/gvmd.sock}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [appnet]
    ports: ["8000:8000"]
    volumes:
      - /opt/gvm-run:/opt/gvm-run
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    networks: [appnet]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  celery:
    build: .
    command: celery -A cyber_pen_test worker --loglevel=info
    env_file: .env
    environment:
      POSTGRES_NAME: ${POSTGRES_NAME:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: cyber_pen_test.settings
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      PYTHONPATH: /code
      GVM_HOST: ${GVM_HOST:-openvas}
      GVM_PORT: ${GVM_PORT:-9390}
      GVM_USER: ${GVM_USER:-admin}
      GVM_PASS: ${GVM_PASS:-admin}
      GVM_SOCKET_PATH: ${GVM_SOCKET_PATH:-/opt/gvm-run/gvmd.sock}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [appnet]
    volumes:
      - /opt/gvm-run:/opt/gvm-run
    healthcheck:
      test: ["CMD-SHELL", "celery -A cyber_pen_test inspect ping -t 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  sniffer:
    build:
      context: .
      dockerfile: sniffer/Dockerfile.sniffer
    command: python /sniffer/listener_api.py
    cap_add: [NET_ADMIN, NET_RAW]
    ports:  ["5050:5050"]
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5050/interfaces || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  appnet:

volumes:
  redis_data:
