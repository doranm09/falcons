{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberTwin Dashboard</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <link href="{% static 'style.css' %}" rel="stylesheet" />
  
</head>
<body>
  <div class="sidebar">
    <div class="logo">
      <img src="{% static 'logo.png' %}" alt="" />
      <h5 class="mt-2"></h5>
    </div>
    <hr />
    <nav class="nav flex-column">
      <a class="nav-link" href="{% url 'dashboard-home' %}"><i class="bi bi-shield-lock-fill"></i> Dashboard</a>
      <a class="nav-link" href="http://127.0.0.1:9392" target="_blank"><i class="bi bi-cpu"></i> OpenVAS</a>
      <a class="nav-link" href="http://127.0.0.1:9001"><i class="bi bi-code-square"></i> MiniWeb</a>
    </nav>
  </div>

  <main>
    {% block content %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
  </main>
</body>
</html>
