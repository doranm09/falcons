        ipv4_address: 172.30.5.60

  kali-attacker:
    build:
      context: .
      dockerfile: testbed/ot/kali/Dockerfile
    tty: true
    stdin_open: true
    command: ["/bin/bash", "-lc", "sleep infinity"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      default: {}
      l3:
        ipv4_address: 172.30.2.250
      l35:
        ipv4_address: 172.30.3.250

  conduit-l01-l2:
    build: ./testbed/ot/conduit
    cap_add: ["NET_ADMIN"]
    environment:
      ALLOWED_PORTS: "15020,15021"
      CONDUIT_MAP: |-
        [
          {"listen_port": 15020, "target_host": "172.30.0.10", "target_port": 15020},
          {"listen_port": 15021, "target_host": "172.30.0.11", "target_port": 15021}
        ]
      LOG_PATH: /data/conduit-l01-l2.log
      FIXED_TIME: "2026-01-25T00:00:00Z"
    volumes:
      - ./testbed/ot/data:/data
    networks:
      l01:
        ipv4_address: 172.30.0.200
      l2:
        ipv4_address: 172.30.1.200

  conduit-l2-l3:
    build: ./testbed/ot/conduit
    cap_add: ["NET_ADMIN"]
    environment:
      ALLOWED_PORTS: "15022,18080"
      CONDUIT_MAP: |-
        [
          {"listen_port": 15022, "target_host": "172.30.1.10", "target_port": 15022},
          {"listen_port": 18080, "target_host": "172.30.2.10", "target_port": 18080}
        ]
      LOG_PATH: /data/conduit-l2-l3.log
      FIXED_TIME: "2026-01-25T00:00:00Z"
    volumes:
      - ./testbed/ot/data:/data
    networks:
      l2:
        ipv4_address: 172.30.1.201
      l3:
        ipv4_address: 172.30.2.201

  conduit-l3-l35:
    build: ./testbed/ot/conduit
    cap_add: ["NET_ADMIN"]
    environment:
      ALLOWED_PORTS: "18883"
      CONDUIT_MAP: |-
        [
          {"listen_port": 18883, "target_host": "172.30.3.10", "target_port": 18883}
