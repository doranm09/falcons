name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Install Playwright browsers
      run: |
        python -m playwright install --with-deps chromium

    - name: Run migrations
      run: |
        python manage.py migrate --settings=cyber_pen_test.test_settings
      env:
        POSTGRES_NAME: testdb
        POSTGRES_USER: testuser
        POSTGRES_PASSWORD: testpass
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb

    - name: Run server tests
      run: |
        pytest tests/server -q --settings=cyber_pen_test.test_settings
      env:
        POSTGRES_NAME: testdb
        POSTGRES_USER: testuser
        POSTGRES_PASSWORD: testpass
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb

    - name: Run E2E tests
      run: |
        pytest tests/e2e -q --settings=cyber_pen_test.test_settings
      env:
        POSTGRES_NAME: testdb
        POSTGRES_USER: testuser
        POSTGRES_PASSWORD: testpass
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb

    - name: Run all tests
      run: |
        pytest -q --settings=cyber_pen_test.test_settings
      env:
        POSTGRES_NAME: testdb
        POSTGRES_USER: testuser
        POSTGRES_PASSWORD: testpass
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb

    - name: Upload Playwright traces on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: test-results/
