services:
  web:
    networks:
      - default
      - l01
      - l2
      - l3
      - l35
      - l4
      - l5

  celery:
    networks:
      - default
      - l01
      - l2
      - l3
      - l35
      - l4
      - l5

  field-sensor:
    image: python:3.11-slim
    command: ["python", "/app/service.py"]
    environment:
      SERVICE_NAME: field-sensor
      SERVICE_ROLE: sensor
      SERVICE_ZONE: L0/1
      SERVICE_PORT: "15020"
      PROTOCOL_NAME: "fieldbus"
      PROTOCOL_RATE: "10/s"
      CONFIG_BASELINE: "field-v1"
      LOG_PATH: /data/field-sensor.log
      FIXED_TIME: "2026-01-25T00:00:00Z"
    volumes:
      - ./testbed/ot/services:/app
      - ./testbed/ot/data:/data
    networks:
      l01:
        ipv4_address: 172.30.0.10

  field-actuator:
    image: python:3.11-slim
    command: ["python", "/app/service.py"]
    environment:
      SERVICE_NAME: field-actuator
      SERVICE_ROLE: actuator
      SERVICE_ZONE: L0/1
      SERVICE_PORT: "15021"
      PROTOCOL_NAME: "fieldbus"
      PROTOCOL_RATE: "10/s"
      CONFIG_BASELINE: "field-v1"
      LOG_PATH: /data/field-actuator.log
      FIXED_TIME: "2026-01-25T00:00:00Z"
