  agent-l01:
    build:
      context: .
      dockerfile: testbed/ot/agent/Dockerfile
    command: ["run", "--url", "http://web:8000"]
    environment:
      AGENT_SERVER_URL: "http://web:8000"
    networks:
      - default
      - l01

  agent-l2:
