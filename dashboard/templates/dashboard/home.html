<!-- templates/dashboard/home.html -->
{% extends "dashboard/base.html" %}
{% block content %}

<div class="card mb-4">
  <div class="card-body">
    <form id="scan-form" class="row g-3">
      <div class="col-auto">
        <input type="text" class="form-control" name="cidr" placeholder="Enter CIDR (e.g., 192.168.1.0/24)">
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-primary">Start Scan</button>
      </div>
    </form>
    <div id="scan-status" class="mt-3 text-muted"></div>
  </div>
</div>

<h5>Discovered Nodes</h5>
<table class="table table-striped">
  <thead>
    <tr>
      <th scope="col">IP Address</th>
      <th scope="col">Hostname</th>
      <th scope="col">Status</th>
      <th scope="col">Last Seen</th>
      <th scope="col">Description</th>
    </tr>
  </thead>
  <tbody id="nodes-body">
    {% for node in nodes %}
    <tr>
      <td>{{ node.ip_address }}</td>
      <td>{{ node.name }}</td>
      <td>{{ node.status }}</td>
      <td>{{ node.last_heartbeat }}</td>
      <td>{{ node.description }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<script>
  const scanForm = document.getElementById('scan-form');
  const scanStatus = document.getElementById('scan-status');
  const nodesBody = document.getElementById('nodes-body');

  scanForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    const formData = new FormData(scanForm);
    const response = await fetch('/scan/start/', {
      method: 'POST',
      body: formData,
    });
    const data = await response.json();
    const taskId = data.task_id;
    scanStatus.innerText = 'Scan started...';

    const interval = setInterval(async () => {
      const statusRes = await fetch(`/scan/status/${taskId}/`);
      const statusData = await statusRes.json();
      if (statusData.state === 'SUCCESS') {
        clearInterval(interval);
        scanStatus.innerText = 'Scan complete. Nodes updated.';
        nodesBody.innerHTML = '';
        statusData.nodes.forEach(node => {
          nodesBody.innerHTML += `
            <tr>
              <td>${node.ip_address}</td>
              <td>${node.name}</td>
              <td>${node.status}</td>
              <td>${node.last_heartbeat || ''}</td>
              <td>${node.description || ''}</td>
            </tr>
          `;
        });
      } else {
        scanStatus.innerText = `Scanning... (${statusData.state})`;
      }
    }, 2000);
  });
</script>

{% endblock %}
