{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberTwin Dashboard</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <link href="{% static 'style.css' %}" rel="stylesheet" />
  
</head>
<body>
  <div class="sidebar">
    <div class="logo">
      <img src="{% static 'logo.png' %}" alt="" />
      <h5 class="mt-2"></h5>
    </div>
    <hr />
    <nav class="nav flex-column">
      <a class="nav-link" href="{% url 'dashboard-home' %}"><i class="bi bi-shield-lock-fill"></i> Dashboard</a>
      <a class="nav-link" href="{% url 'history' %}"><i class="bi bi-clock-history"></i> Scan History</a>
      <a class="nav-link" href="#"><i class="bi bi-diagram-3-fill"></i> Graph View</a>
      <a class="nav-link" href="#"><i class="bi bi-broadcast-pin"></i> Passive Listener</a>
      <a class="nav-link" href="#"><i class="bi bi-terminal"></i> Manual Trigger</a>
      <a class="nav-link" href="#"><i class="bi bi-cpu-fill"></i> System Status</a>
      <a class="nav-link" href="#"><i class="bi bi-gear-fill"></i> Settings</a>
    </nav>
  </div>

  <main>
    {% block content %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
  </main>
</body>
</html>
