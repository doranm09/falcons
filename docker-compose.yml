services:
  db:
    image: postgres:17.2
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [appnet]
    restart: unless-stopped

  web:
    build: .
    command: /code/docker/entrypoint-web.sh
    env_file: .env
    environment:
      POSTGRES_NAME: ${POSTGRES_NAME:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: cyber_pen_test.settings
      PYTHONPATH: /code
      GVM_HOST: ${GVM_HOST:-openvas}
      GVM_PORT: ${GVM_PORT:-9390}
      GVM_USER: ${GVM_USER:-admin}
      GVM_PASS: ${GVM_PASS:-admin}
      GVM_SOCKET_PATH: ${GVM_SOCKET_PATH:-/opt/gvm-run/gvmd.sock}
      RISK_ASSESSMENT_API_URL: ${RISK_ASSESSMENT_API_URL:-http://risk-assessment:7890}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      risk-assessment:
        condition: service_started
    networks: [appnet]
    ports: ["8000:8000"]
    volumes:
      - .:/code
      - /opt/gvm-run:/opt/gvm-run
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    networks: [appnet]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  celery:
    build: .
    command: celery -A cyber_pen_test worker --loglevel=info
    env_file: .env
    environment:
      POSTGRES_NAME: ${POSTGRES_NAME:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: cyber_pen_test.settings
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      PYTHONPATH: /code
      GVM_HOST: ${GVM_HOST:-openvas}
      GVM_PORT: ${GVM_PORT:-9390}
      GVM_USER: ${GVM_USER:-admin}
      GVM_PASS: ${GVM_PASS:-admin}
      GVM_SOCKET_PATH: ${GVM_SOCKET_PATH:-/opt/gvm-run/gvmd.sock}
      RISK_ASSESSMENT_API_URL: ${RISK_ASSESSMENT_API_URL:-http://risk-assessment:7890}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      risk-assessment:
        condition: service_started
    networks: [appnet]
    volumes:
      - .:/code
      - /opt/gvm-run:/opt/gvm-run
    healthcheck:
      test: ["CMD-SHELL", "celery -A cyber_pen_test inspect ping -t 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  sniffer:
    build:
      context: .
      dockerfile: sniffer/Dockerfile.sniffer
    command: python /sniffer/listener_api.py
    cap_add: [NET_ADMIN, NET_RAW]
    ports:  ["5050:5050"]
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5050/interfaces || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  risk-assessment:
    build:
      context: ../ics-risk-assessment
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 7890
    networks: [appnet]
    ports: ["7890:7890"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7890/status')\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports: ["9200:9200"]
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["5601:5601"]
    networks: [appnet]
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  opensearch-init:
    image: curlimages/curl:8.5.0
    depends_on:
      opensearch:
        condition: service_healthy
    networks: [appnet]
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_USER: ${OPENSEARCH_USER:-}
      OPENSEARCH_PASS: ${OPENSEARCH_PASS:-}
    volumes:
      - ./configs/opensearch:/configs:ro
    command: >-
      sh -c "
      AUTH=\"\"; if [ -n \"$${OPENSEARCH_USER}\" ]; then AUTH=\"-u $${OPENSEARCH_USER}:$${OPENSEARCH_PASS}\"; fi;
      curl -fsS $$AUTH -H 'Content-Type: application/json' -X PUT \"$${OPENSEARCH_URL}/_plugins/_ism/policies/siem-events-policy\" -d @/configs/siem_ism_policy.json;
      curl -fsS $$AUTH -H 'Content-Type: application/json' -X PUT \"$${OPENSEARCH_URL}/_index_template/siem-events-template\" -d @/configs/siem_index_template.json;
      "

networks:
  appnet:

volumes:
  redis_data:
  opensearch_data:
