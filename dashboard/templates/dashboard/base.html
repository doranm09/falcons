  <!-- Theme Toggle Script -->
  <script>
    // Theme management
    class ThemeManager {
        constructor() {
            this.themeToggle = document.getElementById('themeToggle');
            this.currentTheme = localStorage.getItem('cyberTheme') || 'light';
            this.init();
        }

        init() {
            // Apply theme after a short delay to ensure CSS is loaded
            setTimeout(() => {
                this.applyTheme(this.currentTheme);
            }, 100);

            // Add event listener for checkbox change
            if (this.themeToggle) {
                this.themeToggle.addEventListener('change', () => {
                    this.toggleTheme();
                });
            }

            // Listen for system theme changes
            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    if (!localStorage.getItem('cyberTheme')) {
                        this.applyTheme(e.matches ? 'dark' : 'light');
                    }
                });
            }
        }

        toggleTheme() {
            const newTheme = this.currentTheme === 'light' ? 'dark' : 'light';
            this.applyTheme(newTheme);
            localStorage.setItem('cyberTheme', newTheme);
        }

        applyTheme(theme) {
            this.currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);

            // Update toggle elements
            if (this.themeToggle) {
                this.themeToggle.checked = theme === 'dark';

                // Update label
                const themeLabel = document.getElementById('themeLabel');
                if (themeLabel) {
                    themeLabel.textContent = theme === 'light' ? 'Light' : 'Dark';
                }
            }
        }

        getCurrentTheme() {
            return this.currentTheme;
        }
    }

    // Initialize theme manager when DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
        window.themeManager = new ThemeManager();
    });

    // Keyboard shortcut for theme toggle (Ctrl/Cmd + Shift + T)
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'T') {
            e.preventDefault();
            if (window.themeManager) {
                window.themeManager.toggleTheme();
            }
        }
    });
  </script>
  <script src="{% static 'js/scan-banner.js' %}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const sidebar = document.querySelector('.sidebar');
        const sidebarToggle = document.querySelector('.sidebar-toggle');
        const sidebarOverlay = document.querySelector('.sidebar-overlay');

        if (!sidebar || !sidebarToggle || !sidebarOverlay) {
            return;
        }

        sidebar.id = 'dashboard-sidebar';

        function setSidebarOpen(isOpen) {
            sidebar.classList.toggle('show', isOpen);
            sidebarOverlay.classList.toggle('show', isOpen);
            document.body.classList.toggle('sidebar-open', isOpen);
            sidebarToggle.setAttribute('aria-expanded', String(isOpen));
            sidebarToggle.innerHTML = isOpen
                ? '<i class="bi bi-x-lg"></i>'
                : '<i class="bi bi-list"></i>';
        }

        sidebarToggle.addEventListener('click', function() {
            setSidebarOpen(!sidebar.classList.contains('show'));
        });

        sidebarOverlay.addEventListener('click', function() {
            setSidebarOpen(false);
        });

        window.addEventListener('resize', function() {
            if (window.innerWidth >= 768) {
                setSidebarOpen(false);
            }
        });
    });
  </script>
