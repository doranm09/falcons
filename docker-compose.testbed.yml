networks:
  l01:
    ipam:
      config:
        - subnet: 172.30.0.0/24
    internal: true
  l2:
    ipam:
      config:
        - subnet: 172.30.1.0/24
    internal: true
  l3:
    ipam:
      config:
        - subnet: 172.30.2.0/24
    internal: true
  l35:
    ipam:
      config:
        - subnet: 172.30.3.0/24
    internal: true
  l4:
    ipam:
      config:
        - subnet: 172.30.4.0/24
    internal: true
  l5:
    ipam:
      config:
        - subnet: 172.30.5.0/24
    internal: true
